# preserve: server.servlet.context-path → quarkus.http.root-path
quarkus.http.port=8080
quarkus.log.level=INFO
quarkus.log.category."org.springframework".level=INFO
quarkus.http.root-path=/petclinic
%dev.quarkus.http.root-path=/petclinic
%prod.quarkus.http.root-path=/petclinic
quarkus.analytics.disabled=true
petclinic.security.enable=false

# O-ENTITYDS + O-PREFLIGHTH2 (refined): default must match factory JDBC URL
# (postgresql). H2 only on %dev/%test so package/verify can use -Dquarkus.profile=test
# or @QuarkusTest. Never leave unprofiled db-kind=h2 — cluster injects
# QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://… and H2 driver rejects it.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:petclinic}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:petclinic}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/petclinic}

%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb

# LLM access is only through the MaaS gateway (see .opencode/skills/llm-integration.md).
# Uncomment when implementing an LLM-powered feature; the workspace injects
# the MAAS_* environment variables.
# quarkus.langchain4j.openai.base-url=${MAAS_API_BASE_URL}
# quarkus.langchain4j.openai.api-key=${MAAS_API_KEY}
# quarkus.langchain4j.openai.chat-model.model-name=${MAAS_MODEL_NAME}
# quarkus.langchain4j.openai.chat-model.temperature=0.1
# quarkus.langchain4j.openai.timeout=60s

# O-HEALTHROOT: keep /q/* outside servlet root-path
quarkus.http.non-application-root-path=/q
# Active repository backend (jpa|jdbc); jdbc impls are profile-gated
petclinic.repository.backend=jpa
