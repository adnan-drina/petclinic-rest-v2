quarkus.http.port=8080
quarkus.log.level=INFO
quarkus.log.category."org.springframework".level=INFO
%dev.quarkus.http.root-path=/petclinic
%prod.quarkus.http.root-path=/petclinic
quarkus.analytics.disabled=true
petclinic.security.enable=false

# Local development datasource (H2)
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb

# LLM access is only through the MaaS gateway (see .opencode/skills/llm-integration.md).
# Uncomment when implementing an LLM-powered feature; the workspace injects
# the MAAS_* environment variables.
# quarkus.langchain4j.openai.base-url=${MAAS_API_BASE_URL}
# quarkus.langchain4j.openai.api-key=${MAAS_API_KEY}
# quarkus.langchain4j.openai.chat-model.model-name=${MAAS_MODEL_NAME}
# quarkus.langchain4j.openai.chat-model.temperature=0.1
# quarkus.langchain4j.openai.timeout=60s

# O-HEALTHROOT: keep /q/* outside servlet root-path
quarkus.http.non-application-root-path=/q
