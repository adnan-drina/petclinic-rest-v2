# preserve: server.servlet.context-path → quarkus.http.root-path
quarkus.http.port=8080
quarkus.log.level=INFO
quarkus.log.category."org.springframework".level=INFO
quarkus.http.root-path=/petclinic
%dev.quarkus.http.root-path=/petclinic
%prod.quarkus.http.root-path=/petclinic
quarkus.analytics.disabled=true
petclinic.security.enable=false

# Quarkus Security JDBC Authentication Configuration
# Only active when petclinic.security.enable=true
quarkus.security.jdbc.enabled=${petclinic.security.enable:false}
quarkus.security.jdbc.principal-query.sql=select username,password,enabled from users where username=?
quarkus.security.jdbc.principal-query.name=find-user
quarkus.security.jdbc.principal-query.attribute.roles.query=select username,role from roles where username=?
quarkus.security.jdbc.principal-query.attribute.roles.index=2
quarkus.security.jdbc.principal-query.clear-password-attribute-name=password
quarkus.security.jdbc.principal-query.enabled-attribute-name=enabled

# O-ENTITYDS + O-PREFLIGHTH2 (refined): default must match factory JDBC URL
# (postgresql). H2 only on %dev/%test so package/verify can use -Dquarkus.profile=test
# or @QuarkusTest. Never leave unprofiled db-kind=h2 — cluster injects
# QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://… and H2 driver rejects it.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:petclinic}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:petclinic}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/petclinic}

%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb

# LLM access is only through the MaaS gateway (see .opencode/skills/llm-integration.md).
# Uncomment when implementing an LLM-powered feature; the workspace injects
# the MAAS_* environment variables.
# quarkus.langchain4j.openai.base-url=${MAAS_API_BASE_URL}
# quarkus.langchain4j.openai.api-key=${MAAS_API_KEY}
# quarkus.langchain4j.openai.chat-model.model-name=${MAAS_MODEL_NAME}
# quarkus.langchain4j.openai.chat-model.temperature=0.1
# quarkus.langchain4j.openai.timeout=60s

# O-HEALTHROOT: keep /q/* outside servlet root-path
quarkus.http.non-application-root-path=/q
# Active repository backend (jpa|jdbc); jdbc impls are profile-gated
petclinic.repository.backend=jpa

# O-TESTSCHEMA: H2 schema for @QuarkusTest / %test verify




# Demo/prod schema: create tables then load import.sql (acceptance needs vets rows).
# %dev/%test use H2 drop-and-create; default (prod) must also create schema — otherwise
# /api/vets → PersistenceException → 503 (relation \"vets\" does not exist).
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=no-file
%acceptancetest.quarkus.hibernate-orm.database.generation=drop-and-create
%acceptancetest.quarkus.hibernate-orm.sql-load-script=import.sql

# O-JACOCOREUSE: keep plain-JUnit jacoco exec when @QuarkusTest runs
quarkus.jacoco.reuse-data-file=true
quarkus.jacoco.data-file=target/jacoco-quarkus.exec

# S07 T-002: Quarkus Security JDBC basic auth (preserve petclinic.security.enable)
# Default false → basic/jdbc off (permit-all). true → JDBC basic auth for /api/*.
quarkus.http.auth.basic=${petclinic.security.enable:false}
quarkus.security.jdbc.enabled=${petclinic.security.enable:false}
quarkus.security.jdbc.principal-query=select username,password,enabled from users where username=?
quarkus.security.jdbc.roles-query=select username,role from roles where username=?
quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated
quarkus.http.auth.permission.authenticated.enabled=${petclinic.security.enable:false}
